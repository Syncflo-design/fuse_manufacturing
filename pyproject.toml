[project]
name = "fuse_manufacturing"
authors = [{ name = "Syncflo", email = "ops@syncflo.co.za" }]
description = "Sage Intacct integration for ERPNext — masters in, stock postings out."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "fuse_manufacturing"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Frappe apps indent with tabs; E101/W191 fight that convention, not real defects.
ignore = ["E101", "E501", "W191"]

[tool.ruff.format]
indent-style = "tab"
